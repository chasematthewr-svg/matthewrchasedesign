<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Contact | Matthew R. Chase Design</title>
  <link rel="stylesheet" href="style.css">

  <style>
    /* Full-screen video background setup */
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -2;
    }

    /* Dark overlay so text remains easy to read over the video */
    .video-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.55);
      z-index: -1;
    }

    /* Shared Float Up + Fade Keyframes */
    @keyframes floatUpFade {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Keep delayed sections hidden initially */
    .contact-hero,
    .contact-container,
    footer {
      opacity: 0;
    }

    /* 1. Header (Starts at 0s) */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.0rem 3rem;
      animation: floatUpFade 2.5s ease-out 0s forwards;
    }

    /* Header logo image styling */
    .logo img {
      max-height: 150px; 
      width: auto;
      display: block;
    }

    /* Centered Navigation & Menu Text */
    nav {
      flex: 1;
      display: flex;
      justify-content: center;
      gap: 1.5rem;
    }

    nav a {
      font-family: "Times New Roman", Times, serif;
      font-size: 1rem;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-decoration: none;
      color: #ffffff;
      transition: color 0.2s ease;
    }

    nav a:hover, nav a.active {
      color: #4af;
    }

    /* Social Media Icons */
    .header-socials {
      display: flex;
      align-items: center;
      gap: 1.0rem;
    }

    .header-socials a img {
      width: 32px;
      height: 32px;
      object-fit: contain;
      filter: brightness(0) invert(1);
      opacity: 0.85;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .header-socials a:hover img {
      opacity: 1;
      transform: translateY(-2px);
    }
    /* 2. Hero Section Header Title (Starts at 2.5s) */
    .contact-hero {
      padding: 4rem 3rem 1rem 3rem;
      text-align: center;
      animation: floatUpFade 2s ease-out 2.5s forwards;
    }

    .contact-title {
      font-family: "Helvetica Neue", Times, serif;
      font-size: 3rem; 
      font-weight: 400;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #ffffff;
      margin: 0;
    }

    /* 3. Contact Info Card (Starts at 4s) */
    .contact-container {
      max-width: 600px;
      margin: 2rem auto 6rem auto;
      padding: 2.5rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      text-align: center;
      animation: floatUpFade 2s ease-out 4s forwards;
    }

    .contact-group {
      margin-bottom: 2rem;
    }

    .contact-group:last-child {
      margin-bottom: 0;
    }

    .contact-label {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #4af;
      margin-bottom: 0.5rem;
    }

    .contact-detail a {
      font-family: "Times New Roman", Times, serif;
      font-size: 1.5rem;
      color: #ffffff;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .contact-detail a:hover {
      color: #4af;
      text-decoration: underline;
    }

    /* Connect Social Links */
    .social-connect-links {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-top: 0.5rem;
    }

    .social-connect-links a {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: 1px;
      color: #ffffff;
      text-decoration: none;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .social-connect-links a:hover {
      color: #4af;
      transform: translateY(-2px);
    }

    /* 4. Footer (Starts at 5.5s) */
    footer {
      text-align: center;
      padding: 2rem;
      color: #888;
      font-size: 0.9rem;
      animation: floatUpFade 1.5s ease-out 5.5s forwards;
    }

    /* Mobile Responsiveness */
    @media (max-width: 600px) {
      .contact-container {
        margin: 1.5rem;
        padding: 1.5rem;
      }

      .social-connect-links {
        flex-direction: column;
        gap: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Background Video Element -->
  <video autoplay muted loop playsinline id="bg-video">
    <source src="Portfolio Background.mp4" type="video/mp4">
  </video>
  
  <!-- Overlay tint for text legibility -->
  <div class="video-overlay"></div>

  <!-- Header & Navigation -->
  <header>
    <div class="logo">
      <a href="index.html">
        <img src="Chase Design Logo.png?v=2" alt="Matthew R. Chase Sound Design">
      </a>
    </div>

    <!-- Centered Main Nav -->
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="resume.html">Resume/CV</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>

    <!-- Social Links -->
    <div class="header-socials">
      <a href="http://www.linkedin.com/in/chasematthewr" target="_blank" rel="noopener noreferrer">
        <img src="linkedin.avif" alt="LinkedIn">
      </a>
      <a href="https://www.facebook.com/ChaseMatthewR" target="_blank" rel="noopener noreferrer">
        <img src="facebook.avif" alt="Facebook">
      </a>
      <a href="https://www.instagram.com/matthewrchase/" target="_blank" rel="noopener noreferrer">
        <img src="instagram.avif" alt="Instagram">
      </a>
    </div>
  </header>

  <!-- Title Header -->
  <section class="contact-hero">
    <h1 class="contact-title">Contact</h1>
  </section>

  <!-- Contact Information Content -->
  <main class="contact-container">
    
    <!-- Phone -->
    <div class="contact-group">
      <div class="contact-label">Phone</div>
      <div class="contact-detail">
        <a href="tel:2246399478">224-639-9478</a>
      </div>
    </div>

    <!-- Email -->
    <div class="contact-group">
      <div class="contact-label">Email</div>
      <div class="contact-detail">
        <a href="mailto:chasematthewr@gmail.com">chasematthewr@gmail.com</a>
      </div>
    </div>

    <!-- Connect -->
    <div class="contact-group">
      <div class="contact-label">Connect</div>
      <div class="social-connect-links">
        <a href="https://www.facebook.com/ChaseMatthewR" target="_blank" rel="noopener noreferrer">Facebook</a>
        <a href="http://www.linkedin.com/in/chasematthewr" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a href="https://www.instagram.com/matthewrchase/" target="_blank" rel="noopener noreferrer">Instagram</a>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; Matthew R. Chase Design. All rights reserved.</p>
  </footer>

</body>
</html>
